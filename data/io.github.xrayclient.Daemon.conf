<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="io.github.xrayclient.Daemon"/>
    <allow send_destination="io.github.xrayclient.Daemon"/>
    <allow receive_sender="io.github.xrayclient.Daemon"/>
  </policy>

  <policy user="root">
    <allow own="io.github.xrayclient.Daemon"/>
  </policy>

  <policy group="wheel">
    <allow send_destination="io.github.xrayclient.Daemon"/>
    <allow receive_sender="io.github.xrayclient.Daemon"/>
  </policy>
</busconfig>
